<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>算法小灶 · 零基础交互式算法课堂</title>
<meta name="description" content="面向算法初学者的中文交互式学习网站：生活化类比 + SVG 动画演示 + 可运行代码 + 复杂度分析 + 练习巩固。">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="打开目录">☰</button>
  <a class="brand" href="#/home">
    <span class="brand-mark">算</span>
    <span class="brand-text">算法小灶</span>
  </a>
  <div class="topbar-progress" title="学习进度">
    <div class="tp-bar"><i id="tpFill"></i></div>
    <span class="tp-text" id="tpText">0 / 0 节</span>
  </div>
  <div class="topbar-right">
    <input class="search-input" id="searchInput" type="search" placeholder="搜索课程…" autocomplete="off">
    <button class="icon-btn" id="resetProgress" title="清空学习进度">⟲</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-inner" id="navTree"></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="content" id="content">
    <div class="loading">正在加载课程…</div>
  </main>
</div>

<div class="search-panel" id="searchPanel" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="js/core/store.js"></script>
<script src="js/core/svg.js"></script>
<script src="js/core/player.js"></script>
<script src="js/core/runner.js"></script>
<script src="js/core/quiz.js"></script>
<script src="js/data/levels.js"></script>
<script src="js/data/beginner.js"></script>
<script src="js/data/intermediate.js"></script>
<script src="js/data/advanced.js"></script>
<script src="js/data/advanced2.js"></script>
<script src="js/app.js"></script>
</body>
</html>
